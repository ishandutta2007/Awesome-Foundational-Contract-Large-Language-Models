<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="accentTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes floatReverse {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardShimmer {
      0% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.8; }
      100% { stroke-opacity: 0.2; }
    }
    .floating-card-1 {
      animation: floatSlow 7s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: floatReverse 8s ease-in-out infinite;
      transform-origin: center;
    }
    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 20 15;
      animation: circuitFlow 14s linear infinite;
    }
    .card-border {
      animation: cardShimmer 4s ease-in-out infinite;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .font-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="url(#cyanOrb)" class="pulsing-orb"/>
  <circle cx="1020" cy="280" r="220" fill="url(#purpleOrb)" class="pulsing-orb"/>

  <!-- Dynamic Network Connection Paths in Background -->
  <path d="M 80 340 Q 300 390, 520 310 T 950 350 T 1150 260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" class="flow-line"/>
  <path d="M 120 80 Q 400 30, 720 110 T 1100 80" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" class="flow-line" style="animation-direction: reverse;"/>

  <!-- Ambient Dynamic Floating Graphic Cards (Positioned behind/flanking foreground text) -->
  <!-- Left Side Graphic: Legal Tech Clause Extraction Card -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="45" y="115" width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" class="card-border"/>
    <circle cx="70" cy="140" r="5" fill="#ef4444"/>
    <circle cx="85" cy="140" r="5" fill="#f59e0b"/>
    <circle cx="100" cy="140" r="5" fill="#10b981"/>
    <rect x="70" y="160" width="130" height="8" rx="4" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="70" y="178" width="170" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>
    <rect x="70" y="192" width="150" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>
    <rect x="70" y="206" width="110" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>
    <rect x="70" y="226" width="85" height="20" rx="6" fill="#0284c7" fill-opacity="0.5"/>
    <text x="78" y="240" fill="#bae6fd" class="font-code" font-size="10" font-weight="600">§ CUAD 41</text>
    <rect x="165" y="226" width="75" height="20" rx="6" fill="#10b981" fill-opacity="0.25"/>
    <text x="173" y="240" fill="#6ee7b7" class="font-code" font-size="10" font-weight="600">✔ RISK: 0</text>
  </g>

  <!-- Right Side Graphic: LLM Contract Agent Reasoning Card -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="935" y="130" width="220" height="160" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" class="card-border"/>
    <circle cx="960" cy="155" r="5" fill="#c084fc"/>
    <text x="975" y="159" fill="#e9d5ff" class="font-code" font-size="11" font-weight="600">Contract_Audit.py</text>
    <rect x="960" y="175" width="140" height="7" rx="3" fill="#818cf8" fill-opacity="0.7"/>
    <rect x="960" y="190" width="170" height="5" rx="2.5" fill="#64748b" fill-opacity="0.5"/>
    <rect x="960" y="203" width="130" height="5" rx="2.5" fill="#64748b" fill-opacity="0.5"/>
    <rect x="960" y="222" width="170" height="26" rx="6" fill="#4f46e5" fill-opacity="0.3" stroke="#6366f1" stroke-width="0.8"/>
    <text x="970" y="238" fill="#a5b4fc" class="font-code" font-size="10">⚡ Indeminification Auto-Redline</text>
    <text x="960" y="272" fill="#38bdf8" class="font-code" font-size="10">&gt; Validation: 100% Complete</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed completely clear, unobstructed & in sharp focus -->
  <g id="foreground-hero">
    <!-- Top Category Pill -->
    <g transform="translate(430, 48)">
      <rect width="340" height="34" rx="17" fill="url(#badgeGrad)" opacity="0.9" filter="url(#glow)"/>
      <rect width="340" height="34" rx="17" fill="#0f172a" opacity="0.75" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="170" y="22" fill="#38bdf8" text-anchor="middle" class="font-code" font-size="12" font-weight="700" letter-spacing="1.5">⚖️ LEGAL TECH &amp; CONTRACT AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#accentTitle)" class="font-title" font-size="44" letter-spacing="-0.5" filter="url(#glow)">
      FOUNDATIONAL CONTRACT LLMs
    </text>
    <text x="600" y="145" text-anchor="middle" fill="#ffffff" class="font-title" font-size="44" letter-spacing="-0.5">
      FOUNDATIONAL CONTRACT LLMs
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="195" text-anchor="middle" fill="#94a3b8" class="font-sub" font-size="20">
      Enterprise SaaS Platforms • Self-Hosted Legal Models • Automated Redlining
    </text>

    <!-- Secondary Line -->
    <text x="600" y="230" text-anchor="middle" fill="#64748b" class="font-sub" font-size="15">
      Clause Extraction • Risk Reasoning • CLM Intelligence • Zero-Data-Retention Architectures
    </text>

    <!-- Feature Attribute Badges / Tags -->
    <g transform="translate(235, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
        <text x="80" y="23" fill="#e0f2fe" text-anchor="middle" class="font-sub" font-size="13" font-weight="600">📜 CUAD &amp; LegalBench</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="175" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.8"/>
        <text x="87" y="23" fill="#e0e7ff" text-anchor="middle" class="font-sub" font-size="13" font-weight="600">🔒 Confidential Inference</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.8"/>
        <text x="85" y="23" fill="#fae8ff" text-anchor="middle" class="font-sub" font-size="13" font-weight="600">🤖 Agentic Redlining</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(565, 0)">
        <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.8"/>
        <text x="82" y="23" fill="#d1fae5" text-anchor="middle" class="font-sub" font-size="13" font-weight="600">🌐 Enterprise CLM</text>
      </g>
    </g>

    <!-- Bottom Terminal Indicator Line -->
    <g transform="translate(390, 360)">
      <rect width="420" height="28" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="14" r="4" fill="#22c55e"/>
      <text x="35" y="18" fill="#94a3b8" class="font-code" font-size="12">status: active tracking | models: commercial &amp; open-source</text>
    </g>
  </g>
</svg>
